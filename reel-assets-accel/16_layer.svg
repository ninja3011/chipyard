<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270">
<rect x="4" y="4" width="472" height="262" rx="18" fill="#0b1118" fill-opacity="0.88" stroke="#4dd2ff" stroke-opacity="0.55" stroke-width="2"/>
<text x="22" y="30" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" fill="#7b8b99" letter-spacing="2">INSIDE THE MODEL</text><rect x="20" y="86" width="88" height="56" rx="10" fill="#111a24" fill-opacity="1.0" stroke="#7b8b99" stroke-width="1.8"/><text x="64" y="112" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="14" font-weight="800" fill="#e8f1f8" text-anchor="middle">words</text><text x="64" y="130" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#7b8b99" text-anchor="middle">so far</text><line x1="110" y1="114" x2="123.0" y2="114.0" stroke="#7b8b99" stroke-width="2.5"/><polygon points="132,114 123.0,109.0 123.0,119.0" fill="#7b8b99"/><rect x="134" y="66" width="214" height="96" rx="12" fill="none" stroke="#7b8b99" stroke-width="1.6" stroke-dasharray="5 4"/><rect x="144" y="90" width="88" height="48" rx="10" fill="#111a24" fill-opacity="1.0" stroke="#4dd2ff" stroke-width="2"/><text x="188" y="110" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="13" font-weight="800" fill="#4dd2ff" text-anchor="middle">attention</text><text x="188" y="126" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#7b8b99" text-anchor="middle">look back</text><line x1="234" y1="114" x2="241.0" y2="114.0" stroke="#7b8b99" stroke-width="2.5"/><polygon points="250,114 241.0,109.0 241.0,119.0" fill="#7b8b99"/><rect x="252" y="90" width="88" height="48" rx="10" fill="#111a24" fill-opacity="1.0" stroke="#b6ff5c" stroke-width="2"/><text x="296" y="108" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" font-weight="800" fill="#b6ff5c" text-anchor="middle">feed-forward</text><text x="296" y="126" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#7b8b99" text-anchor="middle">think it over</text><text x="241" y="182" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="13" font-weight="800" fill="#ffb020" text-anchor="middle">x 6 identical layers</text><line x1="350" y1="114" x2="363.0" y2="114.0" stroke="#7b8b99" stroke-width="2.5"/><polygon points="372,114 363.0,109.0 363.0,119.0" fill="#7b8b99"/><rect x="374" y="86" width="88" height="56" rx="10" fill="#111a24" fill-opacity="1.0" stroke="#ffb020" stroke-width="1.8"/><text x="418" y="108" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="14" font-weight="800" fill="#ffb020" text-anchor="middle">32,000</text><text x="418" y="124" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#7b8b99" text-anchor="middle">scores</text><text x="418" y="138" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#7b8b99" text-anchor="middle">pick best</text><text x="240" y="232" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#e8f1f8" text-anchor="middle">best-scoring token = the next word</text><text x="240" y="252" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#7b8b99" text-anchor="middle">then repeat</text></svg>