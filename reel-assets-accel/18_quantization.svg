<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270">
<rect x="4" y="4" width="472" height="262" rx="18" fill="#0b1118" fill-opacity="0.88" stroke="#4dd2ff" stroke-opacity="0.55" stroke-width="2"/>
<text x="22" y="30" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" fill="#7b8b99" letter-spacing="2">QUANTIZATION: 32-BIT TO 8-BIT (EXAMPLE)</text><rect x="24" y="74" width="150" height="74" rx="10" fill="#111a24" fill-opacity="1.0" stroke="#ffb020" stroke-width="2.2"/><text x="99" y="98" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#7b8b99" text-anchor="middle">32-bit decimal</text><text x="99" y="126" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="18" font-weight="800" fill="#ffb020" text-anchor="middle">0.7318264</text><line x1="178" y1="111" x2="255.0" y2="111.0" stroke="#7b8b99" stroke-width="2.5"/><polygon points="264,111 255.0,106.0 255.0,116.0" fill="#7b8b99"/><text x="221" y="100" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" font-weight="800" fill="#e8f1f8" text-anchor="middle">round</text><text x="221" y="132" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#7b8b99" text-anchor="middle">+ scale</text><rect x="268" y="74" width="110" height="74" rx="10" fill="#111a24" fill-opacity="1.0" stroke="#b6ff5c" stroke-width="2.2"/><text x="323" y="98" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#7b8b99" text-anchor="middle">8-bit integer</text><text x="323" y="128" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="30" font-weight="800" fill="#b6ff5c" text-anchor="middle">93</text><rect x="392" y="74" width="66" height="74" rx="10" fill="#111a24" fill-opacity="1.0" stroke="#7b8b99" stroke-width="1.6"/><text x="425" y="100" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#7b8b99" text-anchor="middle">scale</text><text x="425" y="126" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#e8f1f8" text-anchor="middle">0.00787</text><text x="425" y="140" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#7b8b99" text-anchor="middle">kept</text><line x1="40" y1="190" x2="440" y2="190" stroke="#7b8b99" stroke-width="2"/><line x1="40" y1="184" x2="40" y2="196" stroke="#7b8b99" stroke-width="2"/><text x="40" y="212" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#7b8b99" text-anchor="middle">-128</text><line x1="240" y1="184" x2="240" y2="196" stroke="#7b8b99" stroke-width="2"/><text x="240" y="212" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#7b8b99" text-anchor="middle">0</text><line x1="440" y1="184" x2="440" y2="196" stroke="#7b8b99" stroke-width="2"/><text x="440" y="212" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#7b8b99" text-anchor="middle">127</text><circle cx="386" cy="190" r="6" fill="#b6ff5c"/><text x="240" y="244" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#e8f1f8" text-anchor="middle">scale back later: 93 x 0.00787 = 0.7319</text><text x="240" y="262" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#7b8b99" text-anchor="middle">a little precision lost, answers barely change</text></svg>