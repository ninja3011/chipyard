<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270">
<rect x="4" y="4" width="472" height="262" rx="18" fill="#0b1118" fill-opacity="0.88" stroke="#4dd2ff" stroke-opacity="0.55" stroke-width="2"/>
<text x="22" y="30" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" fill="#7b8b99" letter-spacing="2">THE SPEED</text><text x="240" y="116" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="58" font-weight="800" fill="#ffb020" text-anchor="middle">1.5</text><text x="240" y="146" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="16" font-weight="800" fill="#e8f1f8" text-anchor="middle">tokens per second</text><text x="240" y="186" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#e8f1f8" text-anchor="middle">slow, because time goes to</text><text x="240" y="206" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#e8f1f8" text-anchor="middle">fetching data from memory,</text><text x="240" y="226" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="13" font-weight="800" fill="#b6ff5c" text-anchor="middle">not multiplying</text><text x="240" y="254" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#7b8b99" text-anchor="middle">memory-bound behaviour measured on the small model</text></svg>