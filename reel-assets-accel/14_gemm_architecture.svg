<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#0b1118"/><text x="40" y="54" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="28" font-weight="800" fill="#e8f1f8" text-anchor="start">HOW THE GEMM WORKS</text><text x="40" y="80" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#7b8b99" text-anchor="start">one 8x8 INT8 tile engine, driven by a loop on the CPU, builds a multiplier for ANY size</text><rect x="30" y="110" width="390" height="560" rx="14" fill="#111a24" fill-opacity="1.0" stroke="#4dd2ff" stroke-opacity="0.6" stroke-width="2"/><text x="50" y="142" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="15" font-weight="800" fill="#4dd2ff" text-anchor="start">1  CUT INTO 8x8 TILES</text><text x="50" y="186" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#7b8b99" text-anchor="start">A  16 x 32   (2 x 4 tiles)</text><rect x="50" y="196" width="44" height="44" rx="6" fill="#ffb020" fill-opacity="0.95"/><rect x="98" y="196" width="44" height="44" rx="6" fill="#ffb020" fill-opacity="0.95"/><rect x="146" y="196" width="44" height="44" rx="6" fill="#ffb020" fill-opacity="0.95"/><rect x="194" y="196" width="44" height="44" rx="6" fill="#ffb020" fill-opacity="0.95"/><rect x="50" y="244" width="44" height="44" rx="6" fill="#4dd2ff" fill-opacity="0.22"/><rect x="98" y="244" width="44" height="44" rx="6" fill="#4dd2ff" fill-opacity="0.22"/><rect x="146" y="244" width="44" height="44" rx="6" fill="#4dd2ff" fill-opacity="0.22"/><rect x="194" y="244" width="44" height="44" rx="6" fill="#4dd2ff" fill-opacity="0.22"/><text x="50" y="320" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#7b8b99" text-anchor="start">B  32 x 24   (4 x 3 tiles)</text><rect x="50" y="330" width="44" height="44" rx="6" fill="#4dd2ff" fill-opacity="0.22"/><rect x="98" y="330" width="44" height="44" rx="6" fill="#4dd2ff" fill-opacity="0.95"/><rect x="146" y="330" width="44" height="44" rx="6" fill="#4dd2ff" fill-opacity="0.22"/><rect x="50" y="378" width="44" height="44" rx="6" fill="#4dd2ff" fill-opacity="0.22"/><rect x="98" y="378" width="44" height="44" rx="6" fill="#4dd2ff" fill-opacity="0.95"/><rect x="146" y="378" width="44" height="44" rx="6" fill="#4dd2ff" fill-opacity="0.22"/><rect x="50" y="426" width="44" height="44" rx="6" fill="#4dd2ff" fill-opacity="0.22"/><rect x="98" y="426" width="44" height="44" rx="6" fill="#4dd2ff" fill-opacity="0.95"/><rect x="146" y="426" width="44" height="44" rx="6" fill="#4dd2ff" fill-opacity="0.22"/><rect x="50" y="474" width="44" height="44" rx="6" fill="#4dd2ff" fill-opacity="0.22"/><rect x="98" y="474" width="44" height="44" rx="6" fill="#4dd2ff" fill-opacity="0.95"/><rect x="146" y="474" width="44" height="44" rx="6" fill="#4dd2ff" fill-opacity="0.22"/><text x="50" y="548" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#7b8b99" text-anchor="start">C  16 x 24   (2 x 3 tiles)</text><rect x="50" y="558" width="44" height="44" rx="6" fill="#4dd2ff" fill-opacity="0.22"/><rect x="98" y="558" width="44" height="44" rx="6" fill="#b6ff5c" fill-opacity="0.95"/><rect x="146" y="558" width="44" height="44" rx="6" fill="#4dd2ff" fill-opacity="0.22"/><rect x="50" y="606" width="44" height="44" rx="6" fill="#4dd2ff" fill-opacity="0.22"/><rect x="98" y="606" width="44" height="44" rx="6" fill="#4dd2ff" fill-opacity="0.22"/><rect x="146" y="606" width="44" height="44" rx="6" fill="#4dd2ff" fill-opacity="0.22"/><text x="250" y="262" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" font-weight="800" fill="#ffb020" text-anchor="start">row of A tiles</text><text x="250" y="280" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="22" font-weight="800" fill="#e8f1f8" text-anchor="start">x</text><text x="250" y="300" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" font-weight="800" fill="#4dd2ff" text-anchor="start">column of B tiles</text><text x="250" y="340" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="22" font-weight="800" fill="#e8f1f8" text-anchor="start">=</text><text x="250" y="362" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" font-weight="800" fill="#b6ff5c" text-anchor="start">ONE tile of C</text><text x="250" y="420" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#e8f1f8" text-anchor="start">2x3 output tiles</text><text x="250" y="438" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#e8f1f8" text-anchor="start">x 4 k-slices</text><text x="250" y="462" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="13" font-weight="800" fill="#ffb020" text-anchor="start">= 24 tile multiplies</text><rect x="450" y="110" width="380" height="560" rx="14" fill="#111a24" fill-opacity="1.0" stroke="#ffb020" stroke-opacity="0.6" stroke-width="2"/><text x="470" y="142" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="15" font-weight="800" fill="#ffb020" text-anchor="start">2  THE CPU LOOP  (acc_gemm)</text><rect x="470" y="166" width="340" height="34" rx="7" fill="#0b1118" fill-opacity="0.8" stroke="#7b8b99" stroke-opacity="0.8" stroke-width="1.4"/><text x="484" y="188" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#e8f1f8" text-anchor="start">for each output tile (i, j):</text><rect x="494" y="210" width="316" height="34" rx="7" fill="#0b1118" fill-opacity="0.8" stroke="#b6ff5c" stroke-opacity="0.8" stroke-width="1.4"/><text x="508" y="232" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#b6ff5c" text-anchor="start">acc_clear()</text><rect x="494" y="254" width="316" height="34" rx="7" fill="#0b1118" fill-opacity="0.8" stroke="#7b8b99" stroke-opacity="0.8" stroke-width="1.4"/><text x="508" y="276" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#e8f1f8" text-anchor="start">for k in 0, 8, 16 ... K:</text><rect x="518" y="298" width="292" height="34" rx="7" fill="#0b1118" fill-opacity="0.8" stroke="#7b8b99" stroke-opacity="0.8" stroke-width="1.4"/><text x="532" y="320" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#7b8b99" text-anchor="start">acc_cfg(stride)</text><rect x="518" y="342" width="292" height="34" rx="7" fill="#0b1118" fill-opacity="0.8" stroke="#4dd2ff" stroke-opacity="0.8" stroke-width="1.4"/><text x="532" y="364" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#4dd2ff" text-anchor="start">acc_load_a(tile)</text><rect x="518" y="386" width="292" height="34" rx="7" fill="#0b1118" fill-opacity="0.8" stroke="#4dd2ff" stroke-opacity="0.8" stroke-width="1.4"/><text x="532" y="408" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#4dd2ff" text-anchor="start">acc_load_b(tile)</text><rect x="518" y="430" width="292" height="34" rx="7" fill="#0b1118" fill-opacity="0.8" stroke="#ffb020" stroke-opacity="0.8" stroke-width="1.4"/><text x="532" y="452" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#ffb020" text-anchor="start">acc_mac(flipA, flipB)</text><rect x="494" y="474" width="316" height="34" rx="7" fill="#0b1118" fill-opacity="0.8" stroke="#b6ff5c" stroke-opacity="0.8" stroke-width="1.4"/><text x="508" y="496" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#b6ff5c" text-anchor="start">acc_store32()  or  acc_store8()</text><rect x="470" y="518" width="340" height="34" rx="7" fill="#0b1118" fill-opacity="0.8" stroke="#7b8b99" stroke-opacity="0.8" stroke-width="1.4"/><text x="484" y="540" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#7b8b99" text-anchor="start">acc_sync()  when all done</text><text x="470" y="610" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#7b8b99" text-anchor="start">flip = load the mirrored tile</text><text x="470" y="630" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#7b8b99" text-anchor="start">and set a flag. Data never moves.</text><rect x="860" y="110" width="390" height="560" rx="14" fill="#111a24" fill-opacity="1.0" stroke="#b6ff5c" stroke-opacity="0.6" stroke-width="2"/><text x="880" y="142" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="15" font-weight="800" fill="#b6ff5c" text-anchor="start">3  THE ENGINE (hardware)</text><rect x="880" y="160" width="350" height="44" rx="8" fill="#0b1118" fill-opacity="1.0" stroke="#7b8b99" stroke-opacity="1.0" stroke-width="1.6"/><text x="1055" y="188" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#e8f1f8" text-anchor="middle">command decoder + state machine</text><rect x="880" y="232" width="160" height="64" rx="10" fill="#0b1118" fill-opacity="1.0" stroke="#4dd2ff" stroke-opacity="1.0" stroke-width="2"/><text x="960" y="262" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="15" font-weight="800" fill="#4dd2ff" text-anchor="middle">A regs</text><text x="960" y="282" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#7b8b99" text-anchor="middle">8x8 int8</text><rect x="1070" y="232" width="160" height="64" rx="10" fill="#0b1118" fill-opacity="1.0" stroke="#4dd2ff" stroke-opacity="1.0" stroke-width="2"/><text x="1150" y="262" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="15" font-weight="800" fill="#4dd2ff" text-anchor="middle">B regs</text><text x="1150" y="282" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#7b8b99" text-anchor="middle">8x8 int8</text><line x1="960" y1="296" x2="1046.7" y2="332.5" stroke="#7b8b99" stroke-width="2.5"/><polygon points="1055,336 1048.6,327.9 1044.8,337.1" fill="#7b8b99"/><line x1="1150" y1="296" x2="1063.3" y2="332.5" stroke="#7b8b99" stroke-width="2.5"/><polygon points="1055,336 1065.2,337.1 1061.4,327.9" fill="#7b8b99"/><rect x="910" y="340" width="290" height="70" rx="12" fill="#0b1118" fill-opacity="1.0" stroke="#ffb020" stroke-opacity="1.0" stroke-width="2.4"/><text x="1055" y="372" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="17" font-weight="800" fill="#ffb020" text-anchor="middle">64 multipliers</text><text x="1055" y="394" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#7b8b99" text-anchor="middle">one k-step per cycle (8 cycles/tile)</text><line x1="1055" y1="410" x2="1055.0" y2="439.0" stroke="#7b8b99" stroke-width="2.5"/><polygon points="1055,448 1060.0,439.0 1050.0,439.0" fill="#7b8b99"/><rect x="910" y="452" width="290" height="60" rx="12" fill="#0b1118" fill-opacity="1.0" stroke="#b6ff5c" stroke-opacity="1.0" stroke-width="2.4"/><text x="1055" y="480" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="14" font-weight="800" fill="#b6ff5c" text-anchor="middle">C accumulators  8x8 int32</text><text x="1055" y="500" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#7b8b99" text-anchor="middle">keeps adding across k</text><line x1="1055" y1="512" x2="1055.0" y2="539.0" stroke="#7b8b99" stroke-width="2.5"/><polygon points="1055,548 1060.0,539.0 1050.0,539.0" fill="#7b8b99"/><rect x="910" y="552" width="290" height="44" rx="10" fill="#0b1118" fill-opacity="1.0" stroke="#b6ff5c" stroke-opacity="1.0" stroke-width="1.6"/><text x="1055" y="579" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#e8f1f8" text-anchor="middle">shift / ReLU / clamp -> int8</text><text x="1055" y="634" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#7b8b99" text-anchor="middle">64-bit requests (8 per tile) via the CPU's cache</text><text x="1055" y="654" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#7b8b99" text-anchor="middle">to and from DDR3</text><line x1="422" y1="390" x2="439.0" y2="390.0" stroke="#7b8b99" stroke-width="3"/><polygon points="448,390 439.0,385.0 439.0,395.0" fill="#7b8b99"/><line x1="832" y1="390" x2="849.0" y2="390.0" stroke="#7b8b99" stroke-width="3"/><polygon points="858,390 849.0,385.0 849.0,395.0" fill="#7b8b99"/></svg>