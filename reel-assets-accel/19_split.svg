<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270">
<rect x="4" y="4" width="472" height="262" rx="18" fill="#0b1118" fill-opacity="0.88" stroke="#4dd2ff" stroke-opacity="0.55" stroke-width="2"/>
<text x="22" y="30" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" fill="#7b8b99" letter-spacing="2">WHO DOES WHAT</text><rect x="24" y="52" width="206" height="176" rx="10" fill="#111a24" fill-opacity="1.0" stroke="#ffb020" stroke-width="2.2"/><text x="127" y="80" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="14" font-weight="800" fill="#ffb020" text-anchor="middle">COPROCESSOR</text><text x="127" y="98" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#7b8b99" text-anchor="middle">(our engine)</text><text x="127" y="140" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="15" font-weight="800" fill="#e8f1f8" text-anchor="middle">the big matrix</text><text x="127" y="160" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="15" font-weight="800" fill="#e8f1f8" text-anchor="middle">multiplies</text><text x="127" y="196" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" font-weight="800" fill="#b6ff5c" text-anchor="middle">nearly all the work</text><rect x="250" y="52" width="206" height="176" rx="10" fill="#111a24" fill-opacity="1.0" stroke="#4dd2ff" stroke-width="2.2"/><text x="353" y="80" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="14" font-weight="800" fill="#4dd2ff" text-anchor="middle">CPU</text><text x="353" y="98" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#7b8b99" text-anchor="middle">(the small stuff)</text><text x="353" y="132" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="14" font-weight="800" fill="#e8f1f8" text-anchor="middle">RMSNorm</text><text x="353" y="150" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#7b8b99" text-anchor="middle">keeps numbers in check</text><text x="353" y="176" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="14" font-weight="800" fill="#e8f1f8" text-anchor="middle">softmax</text><text x="353" y="194" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#7b8b99" text-anchor="middle">scores > probabilities</text><text x="353" y="216" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="13" font-weight="800" fill="#e8f1f8" text-anchor="middle">pick the next token</text><text x="240" y="254" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#7b8b99" text-anchor="middle">hardware for the heavy math, software for the rest</text></svg>