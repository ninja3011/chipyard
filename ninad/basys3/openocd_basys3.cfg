# OpenOCD config for TinyRocketConfig on Basys3, via the ESP32 remote_bitbang
# JTAG bridge (esp32_jtag_bridge/esp32_jtag_bridge.ino) wired to PMOD JA per
# basys3.xdc / BasysTop.v.
#
# The debug module is a standard RISC-V External Debug Support v0.13 TAP
# (confirmed from the generated .dts: "compatible = sifive,debug-013,
# riscv,debug-013"), which is fully supported by OpenOCD's built-in "riscv"
# target driver -- no chipyard/rocket-chip-specific script needed. The 0.13
# spec's JTAG DTM uses a fixed 5-bit IR, which is why irlen is 5 below.
#
# `remote_bitbang host`/`port` below verified against the actual driver's
# command registration (src/jtag/drivers/remote_bitbang.c), not assumed.

adapter driver remote_bitbang

# TODO: replace with the IP the ESP32 prints over Serial at boot.
remote_bitbang host 192.168.1.42
remote_bitbang port 4444

transport select jtag

# WiFi round-trip per bit is slow compared to a real probe; this speed
# setting is mostly advisory for remote_bitbang (the ESP32 sets the actual
# pace), but keep it conservative.
adapter speed 100

set _CHIPNAME riscv
jtag newtap $_CHIPNAME cpu -irlen 5

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME riscv -chain-position $_TARGETNAME

init
halt
